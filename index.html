<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생기부 빨간펜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }
    .hero { text-align: center; padding: 60px 20px 30px; color: white; }
    .hero h1 { font-size: 2.6rem; margin-bottom: 12px; }
    .hero p { font-size: 1.1rem; opacity: 0.9; }
    .btn {
      display: inline-block; margin-top: 24px; padding: 14px 36px;
      background: white; color: #764ba2; border: none; border-radius: 30px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .features { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; padding: 20px; }
    .card {
      background: white; border-radius: 16px; padding: 24px; width: 260px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); text-align: center;
    }
    .card .icon { font-size: 2.4rem; margin-bottom: 10px; }
    .card h3 { margin-bottom: 8px; }
    .checker {
      max-width: 800px; margin: 30px auto 60px; background: white;
      border-radius: 16px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    textarea { width: 100%; height: 180px; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
    .result { margin-top: 20px; }
    .result li { margin: 8px 0 8px 20px; }
    .ok { color: green; }
    .bad { color: #d33; }
    .opts { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .opts label { display: flex; flex-direction: column; font-size: .9rem; gap: 4px; }
    .opts select { padding: 8px; border-radius: 8px; border: 1px solid #ddd; }
    .counter { text-align: right; font-size: .85rem; color: #666; margin-top: 6px; }
    .counter.over { color: #d33; font-weight: bold; }
    .marked { white-space: pre-wrap; background: #fafafa; border-radius: 10px; padding: 14px; margin: 12px 0; line-height: 1.8; }
    mark.금지 { background: #ffd6d6; } mark.형식 { background: #ffe9c2; } mark.확인 { background: #fff7b0; }
    b.금지 { color: #d33; } b.형식 { color: #d97706; } b.확인 { color: #a16207; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>📝 생기부 빨간펜</h1>
    <p>AI와 함께 학교생활기록부를 쉽고 빠르게 점검하세요!</p>
    <button class="btn" onclick="document.getElementById('checker').scrollIntoView({behavior:'smooth'})">시작하기</button>
  </section>

  <section class="features">
    <div class="card"><div class="icon">🚫</div><h3>금지어 점검</h3><p>기재할 수 없는 단어를 찾아줍니다.</p></div>
    <div class="card"><div class="icon">📏</div><h3>글자수 확인</h3><p>나이스 바이트 기준으로 계산합니다.</p></div>
    <div class="card"><div class="icon">🤖</div><h3>AI 흔적 탐지</h3><p>AI가 쓴 듯한 표현을 찾아줍니다.</p></div>
  </section>

  <section class="checker" id="checker">
    <h2>문장 점검하기</h2>
    <p style="margin:10px 0">학교급과 영역을 고르고 학생부 문장을 붙여넣은 뒤 점검 버튼을 누르세요.</p>
    <div class="opts">
      <label>학교급
        <select id="level"><option>고등학교</option><option>중학교</option></select>
      </label>
      <label>학년
        <select id="grade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select>
      </label>
      <label>영역
        <select id="area"></select>
      </label>
    </div>
    <textarea id="input" placeholder="여기에 학생부 내용을 붙여넣으세요..."></textarea>
    <div class="counter" id="counter">0 / 0 byte</div>
    <button class="btn" id="run">점검하기</button>
    <div class="result" id="result"></div>
  </section>

  <script type="module">
    import { createChecker, neisBytes } from './js/engine.js';

    const $ = (id) => document.getElementById(id);
    let checker;

    async function load() {
      try {
        const [rules, orgs] = await Promise.all([
          fetch('./data/rules.json').then((r) => r.json()),
          fetch('./data/allowed_orgs.json').then((r) => r.json()),
        ]);
        checker = createChecker(rules, orgs);
        fillAreas();
      } catch (e) {
        $('result').innerHTML = '<p class="bad">규칙을 불러오지 못했습니다. 새로고침 해 주세요.</p>';
      }
    }

    function fillAreas() {
      const areas = checker.areas($('level').value);
      $('area').innerHTML = areas.map((a) => `<option value="${a.id}" data-max="${a.maxBytes}">${a.label} (${a.maxChars}자)</option>`).join('');
      updateCounter();
    }

    function updateCounter() {
      const opt = $('area').selectedOptions[0];
      const max = opt ? Number(opt.dataset.max) : 0;
      const b = neisBytes($('input').value);
      $('counter').textContent = `${b} / ${max} byte`;
      $('counter').className = 'counter' + (b > max ? ' over' : '');
    }

    function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function highlight(text, findings) {
      const marks = findings.filter((f) => f.end > f.start).sort((a, b) => a.start - b.start);
      let out = '', pos = 0;
      for (const f of marks) {
        if (f.start < pos) continue;
        out += esc(text.slice(pos, f.start)) + `<mark class="${f.심각도}" title="${esc(f.항목)}">${esc(text.slice(f.start, f.end))}</mark>`;
        pos = f.end;
      }
      return out + esc(text.slice(pos));
    }

    function run() {
      if (!checker) return;
      const text = $('input').value;
      if (!text.trim()) { $('result').innerHTML = '<p>점검할 문장을 입력해 주세요.</p>'; return; }
      const { findings, bytes, maxBytes } = checker.check(text, {
        level: $('level').value, area: $('area').value, grade: Number($('grade').value),
      });
      const count = (s) => findings.filter((f) => f.심각도 === s).length;
      let html = `<h3>점검 결과</h3><p>금지 ${count('금지')}건 · 형식 ${count('형식')}건 · 확인 ${count('확인')}건 · ${bytes}/${maxBytes} byte</p>`;
      if (!findings.length) html += '<p class="ok">문제가 발견되지 않았습니다! 🎉</p>';
      html += `<div class="marked">${highlight(text, findings)}</div><ul>`;
      for (const f of findings) {
        html += `<li><b class="${f.심각도}">[${f.심각도}] ${esc(f.항목)}</b>${f.match ? ` — “${esc(f.match)}”` : ''}<br><small>${esc(f.메시지)} (근거: ${esc(f.근거 || '')})</small></li>`;
      }
      $('result').innerHTML = html + '</ul>';
    }

    $('level').addEventListener('change', fillAreas);
    $('area').addEventListener('change', updateCounter);
    $('input').addEventListener('input', updateCounter);
    $('run').addEventListener('click', run);
    load();
  </script>
</body>
</html>
